name: Release review checks
on:
  push:
    branches: [main, 'release/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate curated content and boot layout
        run: |
          python3 tests/release_factory_test.py
          python3 tests/release_package_test.py web/install/firmware/SMKSYNTH-1.2.0-first-install-SMK37-Pro.fwsc
      - name: Validate first-install guard and seeded simulator
        run: |
          node tests/release_110_installer_test.mjs
          python3 tests/release_110_packages_test.py
          cc -O1 -DOBV_HOST -DBOARD_SMK37=1 -Ifirmware/src -Ifirmware/gen -o /tmp/controls tests/physical_controls_test.c
          /tmp/controls
          cc -O1 -DOBV_HOST -DBOARD_SMK37=1 -Ifirmware/src -Ifirmware/gen -o /tmp/pedal tests/sustain_panic_test.c
          /tmp/pedal
          cc -O1 -DOBV_HOST -DBOARD_SMK37=1 -Ifirmware/src -Ifirmware/gen -o /tmp/midi-parts tests/midi_parts_test.c
          /tmp/midi-parts
          cc -O1 -DOBV_HOST -DBOARD_SMK37=1 -Ifirmware/src -Ifirmware/gen -o /tmp/controllers tests/midi_controller_audit_test.c
          /tmp/controllers
          cc -O1 -DOBV_HOST -DBOARD_SMK37=1 -Ifirmware/src -Ifirmware/gen -o /tmp/live-params tests/live_parameter_release_test.c
          /tmp/live-params
          cc -O1 -o /tmp/midi-transport tests/midi_transport_test.c
          /tmp/midi-transport
          node tests/release_110_installer_test.mjs
          cc -O2 -o /tmp/midi-only tests/usb_midi_only_test.c
          /tmp/midi-only
          node tests/release_demo_wasm_test.mjs
          node tests/release_i18n_test.mjs
          mkdir -p build
          cc -O2 -o build/backup_server tests/backup_server.c
          node tests/backup_compatibility_test.mjs --protocol
          sh tests/run_elite_tests.sh
          python3 tools/package_release.py build/audit-site
          python3 tools/check_public_web.py build/audit-site
          node tests/simulator_midi_test.mjs
      - name: Native routing and sequencer regression
        run: |
          mkdir -p build
          cc -O1 -DOBV_HOST -DBOARD_SMK37=1 -Ifirmware/src -Ifirmware/gen -o build/release-seq tests/seq_dp2_test.c
          build/release-seq
