name: Publish isolated Endless MIDI SU2
on:
  push:
    branches: [main]
    paths: [.github/workflows/tuning-test.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smksynth-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 333251c33c29cb077bd1745e3ddc45129cf482dd
          path: public
      - uses: actions/checkout@v4
        with:
          ref: 01aab5142bad261937bb0e55471a701f66360386
          path: su1
      - uses: actions/checkout@v4
        with:
          ref: 5cbc8c740f352e5cd0cef7d30f142836e239fcff
          path: su2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the complete SU2 package
        working-directory: su2
        run: sh tests/run_su2_tests.sh
      - name: Assemble frozen public site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.2.2 --repo 4t59m4f784-creator/SMKSYNTH --pattern 'SMKSYNTH-1.2.2-source.zip' --pattern 'SHA256SUMS.txt' --dir public/releases/1.2.2 --clobber
          python3 public/tools/package_release.py build/public-site --reuse-release
          python3 public/tools/check_public_web.py build/public-site
          mkdir -p build/public-site/experimental/sub-osc-su1
          cp -a su1/experimental/sub-osc-su1/. build/public-site/experimental/sub-osc-su1/
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('build/public-site')
          assert (r/'experimental/sub-osc-su1').exists()
          assert not (r/'experimental/endless-midi-su2').exists()
          manifest={str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in r.rglob('*') if p.is_file()}
          Path('build/frozen-public.json').write_text(json.dumps(manifest))
          PY
      - name: Add only the isolated SU2 directory
        run: |
          mkdir -p build/public-site/experimental/endless-midi-su2
          cp -a su2/experimental/endless-midi-su2/. build/public-site/experimental/endless-midi-su2/
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('build/public-site')
          for n,h in json.loads(Path('build/frozen-public.json').read_text()).items():
              assert hashlib.sha256((r/n).read_bytes()).hexdigest()==h,n
          print('PASS: every pre-existing public file preserved byte-for-byte; including SU1 preserved; only SU2 added.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/public-site
      - uses: actions/deploy-pages@v4
        id: deployment
