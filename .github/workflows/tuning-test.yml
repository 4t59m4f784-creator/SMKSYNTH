name: Publish website and isolated installers
on:
  push:
    branches: [main]
    paths:
      - web/site/**
      - .github/workflows/tuning-test.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smksynth-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble website using immutable release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.3.1 --repo 4t59m4f784-creator/SMKSYNTH --pattern 'SMKSYNTH-1.3.1-source.zip' --pattern SHA256SUMS.txt --dir releases/1.3.1 --clobber
          python3 tools/package_release.py build/public-site --reuse-release
          python3 tools/check_public_web.py build/public-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/public-site
      - uses: actions/deploy-pages@v4
        id: deployment
