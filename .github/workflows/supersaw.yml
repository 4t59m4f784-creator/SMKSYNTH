name: Supersaw experimental checks
on:
  push:
    branches: ['experimental/supersaw', 'experimental/super-sp1']
  pull_request:
    paths: ['firmware/src/obv_super*', 'tests/supersaw*', 'tests/super_sp1*', 'tests/sp1*', 'firmware/src/obv_store_read.h', 'experimental/supersaw/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: DSP, persistence and controls
        run: |
          mkdir -p build/supersaw
          cc -O1 -g -fsanitize=address,undefined -fno-sanitize=shift -DOBV_HOST -DBOARD_SMK37=1 -Ifirmware/src -Ifirmware/gen -o build/supersaw/native tests/supersaw_test.c
          ASAN_OPTIONS=detect_leaks=0 build/supersaw/native
          cc -O1 -g -fsanitize=address,undefined -fno-sanitize=shift -DOBV_HOST -DBOARD_SMK37=1 -Ifirmware/src -Ifirmware/gen -o build/supersaw/equivalence tests/supersaw_performance_test.c
          ASAN_OPTIONS=detect_leaks=0 build/supersaw/equivalence
          cc -O2 -DOBV_HOST -Ifirmware/src -Ifirmware/gen -c firmware/src/obv_supersaw.c -o build/supersaw/kernel.o
          cc -Os -DOBV_HOST -DOBV_SUPER_EXTERNAL -DBOARD_SMK37=1 -Ifirmware/src -Ifirmware/gen -c tests/super_sp1_stream.c -o build/supersaw/integration.o
          cc build/supersaw/integration.o build/supersaw/kernel.o -o build/supersaw/integration
          build/supersaw/integration build/supersaw/integration.pcm
          python3 -c "import hashlib; assert hashlib.sha256(open('build/supersaw/integration.pcm','rb').read()).hexdigest() == 'e5bb37e06c1dc145a62d1ec58db5b89d805ec2c305edd7a640d33a7ac1a82000'"
          cc -O2 -o build/supersaw/read tests/sp1_read_test.c
          build/supersaw/read
          sh tests/run_physical_controls_tests.sh
      - name: Pinned installer and stable return
        run: |
          node tests/supersaw_installer_test.mjs
          node tests/release_101_installer_test.mjs
          python3 tests/smk_pkg_test.py experimental/supersaw/SMKSYNTH-1.0.2-ss3-SMK37-Pro.fwsc 'SMK-37 Pro_19621'
          cc -O1 -DBOARD_SMK37=1 -DOBV_VOICE_HW=1 -o build/supersaw/loader tests/backup_loader_test.c
          build/supersaw/loader releases/1.0.2/SMKSYNTH-1.0.2-update-SMK37-Pro.fwsc experimental/supersaw/SMKSYNTH-1.0.2-ss3-SMK37-Pro.fwsc
          build/supersaw/loader experimental/supersaw/SMKSYNTH-1.0.2-ss3-SMK37-Pro.fwsc releases/1.0.2/SMKSYNTH-1.0.2-update-SMK37-Pro.fwsc
