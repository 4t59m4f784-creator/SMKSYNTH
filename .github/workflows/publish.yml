name: Publish SMKSYNTH
on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/tuning-test.yml
      - .github/workflows/publish.yml
      - docs/images/splash-endless-midi-130.png
      - docs/images/smksynth-social-v3.png
      - docs/images/smksynth-social-v3.svg
      - web/site/index.html
      - web/install/index.html
      - tools/check_public_web.py
      - tools/render_splash.c
      - tools/build_social_preview.py
      - .github/workflows/release-review.yml
  workflow_dispatch:
concurrency:
  group: smksynth-publication
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release and website
        run: |
          python3 tests/release_factory_test.py
          python3 tests/release_package_test.py web/install/firmware/SMKSYNTH-1.3.0-first-install-SMK37-Pro.fwsc
          cc -O1 -DOBV_HOST -DBOARD_SMK37=1 -Ifirmware/src -Ifirmware/gen -o /tmp/tuning tests/midi_return_tuning_test.c -lm
          /tmp/tuning
          node tests/release_110_installer_test.mjs
          python3 tests/release_110_packages_test.py
          sh tests/run_su3_tests.sh
          sh tests/run_physical_controls_tests.sh
          cc -O1 -DOBV_HOST -DBOARD_SMK37=1 -Ifirmware/src -Ifirmware/gen -o /tmp/controls tests/physical_controls_test.c
          /tmp/controls
          cc -O2 -o /tmp/midi-only tests/usb_midi_only_test.c
          /tmp/midi-only
          node tests/release_130_wasm_test.mjs
          node tests/release_demo_wasm_test.mjs
          node tests/release_i18n_test.mjs
          mkdir -p build/mo1 build/zm1 build/zm3
          node tests/midi_overview_wasm_test.mjs web/simulator/obervave-voice.wasm
          node tests/battery_release_wasm_test.mjs web/simulator/obervave-voice.wasm 1.3.0
          node tests/midi_layer_wasm_test.mjs web/simulator/obervave-voice.wasm
          node tests/midi_backpressure_wasm_test.mjs web/simulator/obervave-voice.wasm
          node tests/endless_wasm_test.mjs web/simulator/obervave-voice.wasm
          node tests/zoom_wasm_test.mjs web/simulator/obervave-voice.wasm
          node tests/preset_name_wasm_test.mjs web/simulator/obervave-voice.wasm
          mkdir -p build
          cc -O2 -o build/backup_server tests/backup_server.c
          node tests/backup_compatibility_test.mjs --protocol
          sh tests/run_elite_tests.sh
          python3 tools/package_release.py build/audit-site
          python3 tools/check_public_web.py build/audit-site
          node tests/simulator_midi_test.mjs
          cd releases/1.3.0 && sha256sum -c SHA256SUMS.txt
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish versioned firmware and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/package_release.py build/release-site
          if ! gh release view v1.3.0 >/dev/null 2>&1; then
            gh release create v1.3.0 releases/1.3.0/* --target "$GITHUB_SHA" --title 'SMKSYNTH 1.3.0 — Endless MIDI' --notes-file docs/RELEASE-1.3.0.md
          else
            echo 'Release v1.3.0 already exists; immutable downloads left unchanged.'
          fi
          gh release upload v1.3.0 releases/1.3.0/RELEASE.json releases/1.3.0/SMKSYNTH-1.3.0-source.zip releases/1.3.0/SHA256SUMS.txt docs/pdf/SMKSYNTH-1.3.0-*.pdf --clobber
          gh release edit v1.3.0 --notes-file docs/RELEASE-1.3.0.md
  pages:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble frozen release website
        run: python3 tools/package_release.py build/public-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/public-site
      - uses: actions/deploy-pages@v4
        id: deployment
