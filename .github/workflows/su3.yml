name: Validate Endless MIDI SU3
on:
  push:
    branches: [experimental/endless-midi-su3]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sh tests/run_su3_tests.sh
