name: SMKSTAGE B3 hardware alpha
on:
  push:
    branches: [smkstage-b3-alpha]
    paths:
      - 'firmware/src/smkstage.c'
      - 'firmware/src/organ_*.h'
      - 'firmware/src/platform.c'
      - 'tools/build_stage.py'
      - '.github/workflows/smkstage-alpha.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install Pillow
      - name: Fetch Jieli compiler and SDK
        run: |
          tools/get_toolchain.sh
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
      - name: Compile and verify bounds
        run: |
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain"
          export AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          python3 tools/build_stage.py --board smk37 --model pro --experimental-id 19703 --release 0.1.0-b3
      # No firmware artifact upload or release before hardware flash audit.
